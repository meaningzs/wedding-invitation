# 사용법: .env 파일에 VITE_* 값을 넣고 `docker compose up -d --build`
# (.env 는 .gitignore 에 포함되어 커밋되지 않습니다)
services:
  web:
    build:
      context: .
      args:
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:-}
        VITE_KAKAO_SDK_JS_KEY: ${VITE_KAKAO_SDK_JS_KEY:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
        VITE_STATIC_ONLY: ${VITE_STATIC_ONLY:-true}
        BASE_PATH: ${BASE_PATH:-/}
    image: wedding-invitation:latest
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
